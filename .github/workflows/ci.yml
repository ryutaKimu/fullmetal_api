# テストと静的解析を自動実行する CI。
# - Go のバージョンは go.mod の go ディレクティブだけを正とする（go-version-file）
# - 外部アクションはサプライチェーン対策として commit SHA で固定し、
#   Dependabot（.github/dependabot.yml）で SHA とバージョンコメントを更新する
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN は読み取り専用にする（最小権限）
permissions:
  contents: read

# 同じ PR に連続 push されたら古い実行は打ち切る。main への push は全コミットの結果を残す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go をセットアップ
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt されていないファイルがあります"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # -race: データ競合の検出 / -shuffle=on: テストの実行順依存の検出 / -count=1: 復元した GOCACHE のテスト結果を使わず必ず実行する
        run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out ./...

      - name: カバレッジをジョブサマリーに出力
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')
          echo "**Total coverage:** ${total}" >> "$GITHUB_STEP_SUMMARY"
